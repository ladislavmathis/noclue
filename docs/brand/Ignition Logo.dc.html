<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anta&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: #F9682B; }
  a:hover { color: #e0551b; }
</style>
</helmet>
<div style="min-height:100vh;background:#faf8f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:64px;padding:72px 24px;font-family:'Anta',sans-serif;color:#1a1614;">

  <!-- Primary horizontal lockup -->
  <div id="lg-ignition" style="display:flex;align-items:center;gap:22px;padding:12px;">
    <div style="width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
      <img src="rocket.png" alt="rocket" style="width:56px;height:56px;filter:brightness(0) invert(1);" />
    </div>
    <span style="font-size:52px;font-weight:600;letter-spacing:-.02em;">ignition</span>
  </div>

  <!-- ignition labs lockup -->
  <div id="lg-labs" style="display:flex;align-items:center;gap:22px;padding:12px;">
    <div style="width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
      <img src="rocket.png" alt="rocket" style="width:56px;height:56px;filter:brightness(0) invert(1);" />
    </div>
    <span style="font-size:52px;font-weight:600;letter-spacing:-.02em;">ignition <span style="color:#F35216;">labs</span></span>
  </div>

  <!-- VRPinter by ignition lockup -->
  <div id="lg-vrp" style="display:flex;align-items:center;gap:22px;padding:12px;">
    <div style="width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
      <img src="rocket.png" alt="rocket" style="width:56px;height:56px;filter:brightness(0) invert(1);" />
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;line-height:1;">
      <span style="font-size:52px;font-weight:600;letter-spacing:-.02em;">VRPrinter</span>
      <span style="font-size:20px;letter-spacing:.02em;color:#7a726d;">by <span style="color:#F35216;">ignition</span></span>
    </div>
  </div>

  <!-- ignition academy lockup -->
  <div id="lg-academy" style="display:flex;align-items:center;gap:22px;padding:12px;">
    <div style="width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
      <img src="rocket.png" alt="rocket" style="width:56px;height:56px;filter:brightness(0) invert(1);" />
    </div>
    <span style="font-size:52px;font-weight:600;letter-spacing:-.02em;">ignition <span style="color:#F35216;">academy</span></span>
  </div>

  <!-- cloud ignition lockup -->
  <div id="lg-cloud" style="display:flex;align-items:center;gap:22px;padding:12px;">
    <div style="width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
      <img src="rocket.png" alt="rocket" style="width:56px;height:56px;filter:brightness(0) invert(1);" />
    </div>
    <span style="font-size:52px;font-weight:600;letter-spacing:-.02em;"><span style="color:#F35216;">cloud</span> ignition</span>
  </div>

  <!-- Spark lockup -->
  <div id="lg-spark" style="display:flex;align-items:center;gap:22px;padding:12px;">
    <div style="width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 100 100" width="62" height="62" aria-label="spark" style="display:block;">
        <path fill="#fff" d="M50 2 L56 40 L74 26 L60 44 L98 50 L60 56 L74 74 L56 60 L50 98 L44 60 L26 74 L40 56 L2 50 L40 44 L26 26 L44 40 Z"></path>
      </svg>
    </div>
    <span style="font-size:52px;font-weight:600;letter-spacing:-.02em;">spark</span>
  </div>

  <!-- Spark – dark tile + icon only -->
  <div style="display:flex;align-items:center;gap:80px;flex-wrap:wrap;justify-content:center;">
    <div id="lg-spark-icon" style="width:120px;height:120px;border-radius:30px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 100 100" width="78" height="78" aria-label="spark" style="display:block;">
        <path fill="#fff" d="M50 2 L56 40 L74 26 L60 44 L98 50 L60 56 L74 74 L56 60 L50 98 L44 60 L26 74 L40 56 L2 50 L40 44 L26 26 L44 40 Z"></path>
      </svg>
    </div>
    <div id="lg-spark-dark" style="width:120px;height:120px;border-radius:30px;background:#171717;display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 100 100" width="78" height="78" aria-label="spark" style="display:block;">
        <path fill="#F35216" d="M50 2 L56 40 L74 26 L60 44 L98 50 L60 56 L74 74 L56 60 L50 98 L44 60 L26 74 L40 56 L2 50 L40 44 L26 26 L44 40 Z"></path>
      </svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
      <div style="width:88px;height:88px;border-radius:22px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 100 100" width="56" height="56" aria-label="spark" style="display:block;">
          <path fill="#fff" d="M50 2 L56 40 L74 26 L60 44 L98 50 L60 56 L74 74 L56 60 L50 98 L44 60 L26 74 L40 56 L2 50 L40 44 L26 26 L44 40 Z"></path>
        </svg>
      </div>
      <span style="font-size:30px;font-weight:600;letter-spacing:-.01em;">spark</span>
    </div>
  </div>

  <!-- noclue by ignition lockup -->
  <div id="lg-noclue" style="display:flex;align-items:center;gap:22px;padding:12px;">
    <div style="width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 100 100" width="60" height="60" aria-label="noclue" style="display:block;">
        <path d="M30 34 A20 20 0 1 1 58 52 Q50 57 50 66 L50 70" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"></path>
        <circle cx="50" cy="88" r="7.5" fill="#fff"></circle>
      </svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;line-height:1;">
      <span style="font-size:52px;font-weight:600;letter-spacing:-.02em;">noclue</span>
      <span style="font-size:20px;letter-spacing:.02em;color:#7a726d;">by <span style="color:#F35216;">ignition</span></span>
    </div>
  </div>

  <!-- noclue – favicon tiles -->
  <div style="display:flex;align-items:center;gap:80px;flex-wrap:wrap;justify-content:center;">
    <div id="lg-noclue-icon" style="width:120px;height:120px;border-radius:30px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 100 100" width="76" height="76" aria-label="noclue" style="display:block;">
        <path d="M30 34 A20 20 0 1 1 58 52 Q50 57 50 66 L50 70" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"></path>
        <circle cx="50" cy="88" r="7.5" fill="#fff"></circle>
      </svg>
    </div>
    <div id="lg-noclue-dark" style="width:120px;height:120px;border-radius:30px;background:#171717;display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 100 100" width="76" height="76" aria-label="noclue" style="display:block;">
        <path d="M30 34 A20 20 0 1 1 58 52 Q50 57 50 66 L50 70" fill="none" stroke="#F35216" stroke-width="13" stroke-linecap="round"></path>
        <circle cx="50" cy="88" r="7.5" fill="#F35216"></circle>
      </svg>
    </div>
    <div style="display:flex;align-items:center;gap:24px;">
      <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 100 100" width="22" height="22" style="display:block;"><path d="M30 34 A20 20 0 1 1 58 52 Q50 57 50 66 L50 70" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"></path><circle cx="50" cy="88" r="8.5" fill="#fff"></circle></svg>
      </div>
      <div style="width:16px;height:16px;border-radius:4px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 100 100" width="12" height="12" style="display:block;"><path d="M30 34 A20 20 0 1 1 58 52 Q50 57 50 66 L50 70" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"></path><circle cx="50" cy="88" r="9" fill="#fff"></circle></svg>
      </div>
    </div>
  </div>

  <!-- Icon only + stacked -->
  <div style="display:flex;align-items:center;gap:80px;flex-wrap:wrap;justify-content:center;">
    <div id="lg-icon" style="width:120px;height:120px;border-radius:30px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
      <img src="rocket.png" alt="rocket" style="width:70px;height:70px;filter:brightness(0) invert(1);" />
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
      <div style="width:88px;height:88px;border-radius:22px;background:linear-gradient(145deg,#FF7A3C,#F35216);display:flex;align-items:center;justify-content:center;">
        <img src="rocket.png" alt="rocket" style="width:52px;height:52px;filter:brightness(0) invert(1);" />
      </div>
      <span style="font-size:30px;font-weight:600;letter-spacing:-.01em;">ignition</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
